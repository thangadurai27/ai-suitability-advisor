services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    environment:
      DATABASE_URL: sqlite:///./data/ai_suitability_advisor.db
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
